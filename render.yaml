services:
  - type: web
    name: celesto-job-hunt-desk
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: API_PORT
        value: 8080
      - key: DATABASE_URL
        value: sqlite:///./ledger.db
      - key: CELESTO_PROVIDER
        value: cloud
      - key: CELESTO_API_KEY
        value: replace-me
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: LLM_API_KEY
        value: replace-me
